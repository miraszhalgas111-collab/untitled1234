<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | Business & Finance</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar">

    <div class="logo">
        BF<span>+</span>
    </div>

    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Me</a></li>
        <li><a href="finance.html">Finance</a></li>
        <li><a href="contact.html">Contact</a></li>
    </ul>

</nav>


<section class="contact-section">

    <p class="small-title">GET IN TOUCH</p>

    <h1>Let's Talk</h1>

    <p class="contact-intro">
        Have a question about business or finance?
        Send us a message.
    </p>


    <div class="contact-container">


        <img
                class="contact-image"
                src="https://images.unsplash.com/photo-1556761175-4b46a572b786?auto=format&fit=crop&w=1000&q=80"
                alt="Business discussion"
        >


        <form>


            <div class="form-group">

                <label for="name">
                    Name
                </label>

                <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your name"
                        required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                >

            </div>


            <div class="form-group">

                <label for="topic">
                    Choose a topic
                </label>

                <select id="topic" name="topic">

                    <option value="business">
                        Business
                    </option>

                    <option value="finance">
                        Finance
                    </option>

                    <option value="investment">
                        Investment
                    </option>

                    <option value="other">
                        Other
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    Your interest level
                </label>


                <div class="radio-group">

                    <label>
                        <input
                                type="radio"
                                name="level"
                                value="beginner"
                        >
                        Beginner
                    </label>


                    <label>
                        <input
                                type="radio"
                                name="level"
                                value="intermediate"
                        >
                        Intermediate
                    </label>


                    <label>
                        <input
                                type="radio"
                                name="level"
                                value="advanced"
                        >
                        Advanced
                    </label>

                </div>

            </div>


            <div class="form-group">

                <label for="message">
                    Message
                </label>

                <textarea
                        id="message"
                        name="message"
                        placeholder="Write your message..."
                ></textarea>

            </div>


            <button
                    type="submit"
                    class="submit-button"
            >
                Send Message
            </button>

        </form>

    </div>

</section>


<footer>

    <p>
        © 2026 Business & Finance |
        Team member: Miras
    </p>

</footer>

</body>
</html>
